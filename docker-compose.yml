services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lablink
      POSTGRES_USER: lablink
      POSTGRES_PASSWORD: lablink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lablink -d lablink"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: "postgresql://lablink:lablink@postgres:5432/lablink?schema=public"
      JWT_SECRET: "replace-with-a-secure-secret"
      PORT: "5000"
      NODE_ENV: "development"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: "http://localhost:5000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
